name: Profile
on:
  schedule: [{cron: "30 0 * * *"}]
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: ["src/**", "README.template.md", "package.json", "package-lock.json", ".github/workflows/profile.yml"]

concurrency:
  group: profile
  cancel-in-progress: false

# Actions are pinned to commit SHAs (tag in the trailing comment).
jobs:
  # Runs third-party code (npm packages) with a read-only token.
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profile
          path: |
            README.md
            assets/
          if-no-files-found: error
          retention-days: 1

  # Holds the write token, but runs no npm code: only git.
  commit:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Replace generated files with the new build
        run: rm -rf assets README.md
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: profile
          path: .
      - name: Commit README.md and assets if changed
        run: |
          if [ -z "$(git status --porcelain -- README.md assets)" ]; then
            echo "No changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- README.md assets
          git commit -m "Update README.md - [Skip GitHub Action]"
          git push
